<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T-shirt order form</title>
</head>
<body>
  <main>
    <h1>Order your t-shirt</h1>

    <p>Please confirm your details and choose your t-shirt colour and size.</p>

    <form>

      <!-- CUSTOMER NAME -->
      <div>
        <label for="customer-name">Full name</label>
        <input
          id="customer-name"
          name="customer-name"
          type="text"
          minlength="2"
          required
        >
      </div>

      <!-- CUSTOMER EMAIL -->
      <div>
        <label for="customer-email">Email address</label>
        <input
          id="customer-email"
          name="customer-email"
          type="email"
          required
        >
      </div>

      <!-- T-SHIRT COLOUR (3 OPTIONS) -->
      <fieldset>
        <legend>T-shirt colour</legend>

        <div>
          <input
            id="colour-black"
            name="tshirt-colour"
            type="radio"
            value="black"
            required
          >
          <label for="colour-black">Black</label>
        </div>

        <div>
          <input
            id="colour-white"
            name="tshirt-colour"
            type="radio"
            value="white"
          >
          <label for="colour-white">White</label>
        </div>

        <div>
          <input
            id="colour-blue"
            name="tshirt-colour"
            type="radio"
            value="blue"
          >
          <label for="colour-blue">Blue</label>
        </div>
      </fieldset>

      <!-- T-SHIRT SIZE (6 OPTIONS) -->
      <fieldset>
        <legend>T-shirt size</legend>

        <div>
          <input
            id="size-xs"
            name="tshirt-size"
            type="radio"
            value="XS"
            required
          >
          <label for="size-xs">XS</label>
        </div>

        <div>
          <input
            id="size-s"
            name="tshirt-size"
            type="radio"
            value="S"
          >
          <label for="size-s">S</label>
        </div>

        <div>
          <input
            id="size-m"
            name="tshirt-size"
            type="radio"
            value="M"
          >
          <label for="size-m">M</label>
        </div>

        <div>
          <input
            id="size-l"
            name="tshirt-size"
            type="radio"
            value="L"
          >
          <label for="size-l">L</label>
        </div>

        <div>
          <input
            id="size-xl"
            name="tshirt-size"
            type="radio"
            value="XL"
          >
          <label for="size-xl">XL</label>
        </div>

        <div>
          <input
            id="size-xxl"
            name="tshirt-size"
            type="radio"
            value="XXL"
          >
          <label for="size-xxl">XXL</label>
        </div>
      </fieldset>

      <!-- SUBMIT BUTTON -->
      <button type="submit">Submit order</button>
    </form>
  </main>
</body>
</html>
